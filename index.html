        "<div id='item-info' style='font-size:12px; color:#555; margin-top:4px;'></div>" +
        "<div style='font-size:14px; font-weight:bold; margin:8px 0 4px 0; border-top:1px solid #ddd; padding-top:6px;'>測站類別（可複選）</div>" +
        "<div id='cat-box'></div>";
    var host = document.querySelector('.leaflet-control-layers');
    if (host) { host.appendChild(panel); }
    else {
        var ctl = L.control({position: 'topleft'});
        ctl.onAdd = function () {
            var d = L.DomUtil.create('div', 'leaflet-control-layers leaflet-control-layers-expanded');
            d.appendChild(panel); L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d); return d;
        };
        ctl.addTo(MAP);
    }
    var searchEl = document.getElementById('item-search'), itemSel = document.getElementById('item-sel');
    var countEl = document.getElementById('item-count'), info = document.getElementById('item-info');
    L.DomEvent.on(searchEl, 'keydown keypress keyup', L.DomEvent.stopPropagation);   // 打字時不要觸發地圖的鍵盤縮放

    // ---------- 測站類別勾選 ----------
    var LEAVES = [], PARENTS = [];
    function setLayer(li, on) {
        var fg = LAYERS[li]; if (!fg) return;
        if (on && !MAP.hasLayer(fg)) { MAP.addLayer(fg); }
        if (!on && MAP.hasLayer(fg)) { MAP.removeLayer(fg); }
    }
    function makeRow(label, indent) {
        var lb = document.createElement('label');
        lb.style.cssText = 'display:block; font-size:13px; cursor:pointer; margin:3px 0; padding-left:' + indent + 'px;';
        var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.style.marginRight = '6px';
        var tx = document.createElement('span'); tx.textContent = label;
        var ct = document.createElement('span'); ct.style.cssText = 'color:#888; margin-left:4px; font-size:12px;';
        lb.appendChild(cb); lb.appendChild(tx); lb.appendChild(ct);
        return {lb: lb, cb: cb, ct: ct};
    }
    var catBox = document.getElementById('cat-box');
    CATS.forEach(function (c) {
        if (!c.children) {
            var r = makeRow(c.label, 0); catBox.appendChild(r.lb);
            r.cb.addEventListener('change', function () { setLayer(c.layer, r.cb.checked); refreshInfo(); });
            LEAVES.push({li: c.layer, cb: r.cb, ct: r.ct});
        } else {
            var pr = makeRow(c.label, 0); catBox.appendChild(pr.lb);
            var kids = [];
            c.children.forEach(function (k) {
                var r = makeRow(k.label, 18); catBox.appendChild(r.lb);
                var leaf = {li: k.layer, cb: r.cb, ct: r.ct}; LEAVES.push(leaf); kids.push(leaf);
                r.cb.addEventListener('change', function () { setLayer(k.layer, r.cb.checked); syncParents(); refreshInfo(); });
            });
            PARENTS.push({cb: pr.cb, ct: pr.ct, kids: kids});
            pr.cb.addEventListener('change', function () {
                kids.forEach(function (kd) { kd.cb.checked = pr.cb.checked; setLayer(kd.li, pr.cb.checked); });
                refreshInfo();
            });
        }
    });
    function syncParents() {
        PARENTS.forEach(function (p) {
            var on = 0; p.kids.forEach(function (k) { if (k.cb.checked) on++; });
            p.cb.checked = (on === p.kids.length); p.cb.indeterminate = (on > 0 && on < p.kids.length);
        });
    }

    var currentId = 'SO2';
    function refreshInfo() {
        var cnt = {}; (DATA[currentId] || []).forEach(function (r) { cnt[r[0]] = (cnt[r[0]] || 0) + 1; });
        var miss = (STATS[currentId] || {}).miss || {};
        var shown = 0, missShown = 0;
        LEAVES.forEach(function (l) {
            var n = cnt[l.li] || 0;
            l.ct.textContent = '(' + n + ')'; l.ct.style.color = n ? '#555' : '#bbb';
            if (l.cb.checked) { shown += n; missShown += (miss[l.li] || 0); }
        });
        PARENTS.forEach(function (p) {
            var t = 0; p.kids.forEach(function (k) { t += (cnt[k.li] || 0); });
            p.ct.textContent = '(' + t + ')'; p.ct.style.color = t ? '#555' : '#bbb';
        });
        info.textContent = '地圖上 ' + shown + ' 站' + (missShown ? '｜無座標 ' + missShown + ' 站（見 Excel）' : '');
    }
    function showCurrent() {
        if (!itemSel.value) return;
        currentId = itemSel.value;
        drawItem(currentId);
        refreshInfo();
    }

    // ---------- 測項：搜尋 + 下拉 ----------
    function fillItems(q) {
        q = (q || '').trim().toLowerCase();
        while (itemSel.firstChild) { itemSel.removeChild(itemSel.firstChild); }
        var n = 0, gs = 0;
        GROUPS.forEach(function (g) {
            var og = document.createElement('optgroup'); og.label = g.label; var c = 0;
            g.items.forEach(function (it) {
                if (q && it.q.indexOf(q) < 0) return;
                var o = document.createElement('option'); o.value = it.id; o.textContent = it.label; og.appendChild(o); c++; n++;
            });
            if (c) { itemSel.appendChild(og); gs++; }
        });
        itemSel.size = (q && n > 1) ? Math.min(n + gs, 9) : 1;        // 搜尋時直接把符合的列出來
        countEl.textContent = q ? ('符合 ' + n + ' 個測項') : ('共 ' + TOTAL + ' 個測項');
        return n;
    }
    function selectId(id) {
        for (var i = 0; i < itemSel.options.length; i++) { if (itemSel.options[i].value === id) { itemSel.selectedIndex = i; return true; } }
        return false;
    }
    searchEl.addEventListener('input', function () {
        var q = searchEl.value.trim();
        var n = fillItems(q);
        if (n > 0) { if (q || !selectId(currentId)) { itemSel.selectedIndex = 0; } if (!q) { selectId(currentId); } showCurrent(); }
        else { info.textContent = '找不到符合的測項'; }
    });
    searchEl.addEventListener('keydown', function (e) { if (e.key === 'ArrowDown' || e.key === 'Enter') { itemSel.focus(); } });
    itemSel.addEventListener('change', showCurrent);
    function step(d) {
        var i = itemSel.selectedIndex + d;
        if (i >= 0 && i < itemSel.options.length) { itemSel.selectedIndex = i; showCurrent(); }
    }
    document.getElementById('item-prev').addEventListener('click', function () { step(-1); });
    document.getElementById('item-next').addEventListener('click', function () { step(1); });

    fillItems(''); selectId('SO2'); syncParents(); showCurrent();
});
