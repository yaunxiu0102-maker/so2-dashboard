        (DATA[id] || []).forEach(function (r) {
            var mk = L.circleMarker([r[1], r[2]], {radius: r[4], color: 'black', weight: r[5], fill: true, fillColor: r[3], fillOpacity: 0.9});
            mk.bindTooltip(tip(r), {sticky: true});
            LAYERS[r[0]].addLayer(mk);
        });
        renderLegend(id);
    }

    var ctl = L.control({position: 'topright'});
    ctl.onAdd = function () {
        var div = L.DomUtil.create('div', 'leaflet-control-layers leaflet-control-layers-expanded');
        div.style.padding = '8px 10px'; div.style.width = '270px';
        var h = "<div style='font-size:14px; font-weight:bold; margin-bottom:6px;'>測項選擇</div>";
        h += "<div style='font-size:12px; color:#555;'>資料來源</div><select id='src-sel' style='width:100%; margin-bottom:6px; font-size:13px;'>";
        SOURCES.forEach(function (s, i) { h += "<option value='" + i + "'>" + s.label + "</option>"; });
        h += "</select>";
        h += "<div id='item-wrap'><div style='font-size:12px; color:#555;'>測項</div>";
        h += "<div style='display:flex; gap:4px;'><button id='item-prev' type='button' style='cursor:pointer;'>◀</button>";
        h += "<select id='item-sel' style='flex:1; min-width:0; font-size:13px;'></select>";
        h += "<button id='item-next' type='button' style='cursor:pointer;'>▶</button></div></div>";
        h += "<div id='item-info' style='font-size:12px; color:#555; margin-top:6px;'></div>";
        div.innerHTML = h;
        L.DomEvent.disableClickPropagation(div); L.DomEvent.disableScrollPropagation(div);
        return div;
    };
    ctl.addTo(MAP);

    var srcSel = document.getElementById('src-sel'), itemSel = document.getElementById('item-sel');
    var wrap = document.getElementById('item-wrap'), info = document.getElementById('item-info');
    var INFO = {};
    SOURCES.forEach(function (s) { s.groups.forEach(function (g) { g.items.forEach(function (it) { INFO[it.id] = it; }); }); });

    function fillItems(si) {
        var s = SOURCES[si], h = "", n = 0;
        s.groups.forEach(function (g) {
            if (g.label) { h += "<optgroup label='" + g.label + "'>"; }
            g.items.forEach(function (it) { h += "<option value='" + it.id + "'>" + it.label + "</option>"; n++; });
            if (g.label) { h += "</optgroup>"; }
        });
        itemSel.innerHTML = h;
        wrap.style.display = (n <= 1) ? 'none' : 'block';
    }
    function showCurrent() {
        var id = itemSel.value, it = INFO[id];
        drawItem(id);
        if (it && it.n !== undefined) {
            info.innerHTML = "地圖上 " + it.n + " 站" + (it.miss ? "｜無座標 " + it.miss + " 站（見 Excel）" : "");
        } else { info.innerHTML = ""; }
    }
    srcSel.addEventListener('change', function () { fillItems(parseInt(srcSel.value)); showCurrent(); });
    itemSel.addEventListener('change', showCurrent);
    function step(d) {
        var i = itemSel.selectedIndex + d;
        if (i >= 0 && i < itemSel.options.length) { itemSel.selectedIndex = i; showCurrent(); }
    }
    document.getElementById('item-prev').addEventListener('click', function () { step(-1); });
    document.getElementById('item-next').addEventListener('click', function () { step(1); });

    fillItems(0); showCurrent();
});
